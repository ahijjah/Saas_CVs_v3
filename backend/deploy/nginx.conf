# Nginx configuration for CV Analyzer SaaS
# Place in /etc/nginx/sites-available/cv-analyzer
# Enable: ln -s /etc/nginx/sites-available/cv-analyzer /etc/nginx/sites-enabled/
# SSL: certbot --nginx -d app.ai970.cloud -d api.ai970.cloud

# Frontend — React SPA
server {
    listen 80;
    server_name app.ai970.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.ai970.cloud;

    ssl_certificate     /etc/letsencrypt/live/app.ai970.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.ai970.cloud/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/cv-analyzer/dist;
    index index.html;

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets — long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}

# Backend — FastAPI
server {
    listen 80;
    server_name api.ai970.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.ai970.cloud;

    ssl_certificate     /etc/letsencrypt/live/api.ai970.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ai970.cloud/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 15M;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
