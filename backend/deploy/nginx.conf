# Nginx configuration — IP-based deployment (no SSL)
# Server: 72.62.31.221
# Frontend: http://72.62.31.221  (port 80)
# API:      http://72.62.31.221:8000  (FastAPI exposed directly)
#
# Install:
#   cp nginx.conf /etc/nginx/sites-available/cv-analyzer
#   ln -sf /etc/nginx/sites-available/cv-analyzer /etc/nginx/sites-enabled/cv-analyzer
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx

server {
    listen 80 default_server;
    server_name 72.62.31.221 _;

    root  /var/www/cv-analyzer/dist;
    index index.html;

    # React SPA — all unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets — long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
